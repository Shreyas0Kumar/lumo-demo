<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumo — Child-safe voice AI demo</title>
    <meta name="description" content="A child-safe voice AI demo built on OpenAI Realtime API v2. Every response is safety-checked. Every session is visible to parents." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2240%22%20fill%3D%22%236EE7B7%22%2F%3E%3C%2Fsvg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        /* Warm paper palette — matches landing page */
        --paper:      #FBF6EC;
        --paper-2:    #F4ECDC;
        --paper-3:    #EFE4CE;
        --cream-card: #FFFBF2;
        --ink:        #1E1A14;
        --ink-soft:   #4A433A;
        --ink-mute:   #8A8170;
        --rule:       #E3D7BE;
        --sun:        #F4B24A;
        --sun-soft:   #FCE0A9;
        --coral:      #E86B5A;
        --teal:       #3F8C85;

        /* Legacy aliases so existing CSS keeps working */
        --bg-light:    var(--paper);
        --bg-dark:     var(--paper);
        --surface-dark: var(--paper-2);
        --pill-dark:   var(--paper-2);
        --border-light: var(--rule);
        --border-dark: var(--rule);
        --text-light:  var(--ink);
        --text-dark:   var(--ink);
        --muted-light: var(--ink-mute);
        --muted-dark:  var(--ink-mute);
        --accent:      var(--sun);
        --accent-deep: var(--teal);

        /* Safety reason-code colors (kept semantic, warmed) */
        --c-ok:         #4F9D6B;
        --c-redirect:   #3F8C85;
        --c-escalate:   #E0A040;
        --c-harm:       #C0533F;
        --c-dependency: #E86B5A;
        --c-sensitive:  #8A6FB1;
        --c-age:        #6FA8A1;
      }
      .font-display { font-family: "Fraunces", ui-serif, Georgia, serif; font-variation-settings: "opsz" 144; letter-spacing: -0.02em; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text-light);
        background: var(--bg-light);
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }
      button { font-family: inherit; cursor: pointer; }

      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

      .screen { display: none; min-height: 100vh; }
      .screen.active { display: block; }
      #voice-screen.active { display: grid; }
      #age-gate.active { display: flex; }

      /* ------------ Landing ------------ */
      #landing { background: var(--bg-light); }

      .nav {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 32px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background: rgba(250, 250, 249, 0.75);
        border-bottom: 1px solid var(--border-light);
      }
      .wordmark { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
      .btn-primary {
        background: var(--text-light);
        color: var(--bg-light);
        border: none;
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 500;
        font-size: 14px;
        transition: transform 0.15s, opacity 0.15s;
      }
      .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }

      .btn-ghost {
        background: transparent;
        border: 1px solid var(--border-light);
        color: var(--text-light);
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 500;
        font-size: 14px;
      }

      .hero {
        min-height: calc(100vh - 65px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 80px 24px;
        position: relative;
        overflow: hidden;
      }
      .hero-orb-bg {
        position: absolute;
        width: 520px; height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #a7f3d0, #6ee7b7 40%, rgba(110,231,183,0) 70%);
        opacity: 0.55;
        filter: blur(8px);
        animation: heroPulse 6s ease-in-out infinite;
        z-index: 0;
        top: 40%;
        transform: translateY(-50%);
      }
      @keyframes heroPulse {
        0%, 100% { transform: translateY(-50%) scale(1); opacity: 0.55; }
        50%      { transform: translateY(-50%) scale(1.08); opacity: 0.7; }
      }
      .hero > * { position: relative; z-index: 1; }
      .eyebrow {
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.12em;
        color: var(--muted-light);
        font-weight: 500;
        margin-bottom: 24px;
      }
      .hero h1 {
        font-size: clamp(36px, 6vw, 64px);
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.05;
        max-width: 900px;
        margin: 0 0 20px;
      }
      .hero p {
        font-size: 18px;
        color: var(--muted-light);
        max-width: 560px;
        line-height: 1.5;
        margin: 0 0 36px;
      }
      .hero-ctas { display: flex; gap: 16px; align-items: center; }
      .link-arrow { color: var(--muted-light); font-size: 14px; font-weight: 500; }
      .link-arrow:hover { color: var(--text-light); }

      /* ------------ How it works ------------ */
      .how {
        padding: 96px 32px;
        background: white;
        border-top: 1px solid var(--border-light);
      }
      .how-inner {
        max-width: 1080px;
        margin: 0 auto;
      }
      .section-title {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted-light);
        font-weight: 500;
        margin-bottom: 32px;
        text-align: center;
      }
      .cols-3 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 32px;
      }
      .feature {
        padding: 32px 28px;
        border: 1px solid var(--border-light);
        border-radius: 16px;
        background: var(--bg-light);
      }
      .feature-icon {
        width: 36px; height: 36px;
        color: var(--accent-deep);
        margin-bottom: 20px;
      }
      .feature h3 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .feature p { margin: 0; color: var(--muted-light); line-height: 1.55; font-size: 15px; }

      /* ------------ Architecture strip ------------ */
      .arch {
        background: #0f0f0f;
        color: #e5e5e5;
        padding: 80px 32px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
      .arch-inner { max-width: 980px; margin: 0 auto; }
      .arch h2 {
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #6b7280;
        margin: 0 0 32px;
        text-align: center;
      }
      .arch-diagram {
        font-size: 13px;
        line-height: 1.8;
        white-space: pre;
        overflow-x: auto;
        color: #d4d4d4;
        text-align: center;
      }
      .arch-note {
        margin-top: 32px;
        text-align: center;
        font-size: 13px;
        color: #9ca3af;
      }
      .arch-note .accent { color: var(--accent); }

      /* ------------ Footer ------------ */
      footer {
        padding: 32px;
        text-align: center;
        font-size: 13px;
        color: var(--muted-light);
        border-top: 1px solid var(--border-light);
      }
      footer a { color: var(--muted-light); text-decoration: underline; text-decoration-color: var(--border-light); }
      footer a:hover { color: var(--text-light); }

      /* ------------ Age gate modal ------------ */
      #age-gate {
        position: fixed;
        inset: 0;
        background: rgba(251, 246, 236, 0.97);
        backdrop-filter: blur(8px);
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      #age-gate.shown { opacity: 1; }
      .modal {
        position: relative;
        text-align: center;
        color: var(--ink);
        max-width: 720px;
        width: 100%;
      }
      .modal-close {
        position: absolute;
        top: -8px; right: 0;
        background: transparent;
        border: none;
        color: var(--ink-mute);
        font-size: 28px;
        line-height: 1;
        padding: 8px;
      }
      .modal-close:hover { color: var(--ink); }
      .modal-orb {
        width: 80px; height: 80px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #FCE0A9, #F4B24A 60%, #C8852A);
        margin: 0 auto 32px;
        box-shadow: 0 0 60px rgba(244,178,74,0.35);
        animation: orbIdle 4s ease-in-out infinite;
      }
      .modal h2 {
        font-family: "Fraunces", ui-serif, Georgia, serif;
        font-variation-settings: "opsz" 144;
        font-size: clamp(28px, 4vw, 40px);
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 12px;
      }
      .modal-sub {
        color: var(--ink-mute);
        margin: 0 0 40px;
        font-size: 16px;
      }
      .age-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .age-card {
        background: var(--cream-card);
        border: 1px solid var(--rule);
        border-radius: 16px;
        padding: 40px 16px;
        color: var(--ink);
        font-family: "Fraunces", ui-serif, Georgia, serif;
        font-variation-settings: "opsz" 144;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.01em;
        transition: transform 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
      }
      .age-card:hover {
        transform: translateY(-4px);
        border-color: var(--sun);
        background: var(--sun-soft);
        box-shadow: 0 18px 40px -24px rgba(30,26,20,0.18);
      }
      .age-card.selected {
        border-color: var(--sun);
        background: var(--sun-soft);
      }
      @media (max-width: 540px) {
        .age-cards { grid-template-columns: 1fr; }
      }

      .dur-btn {
        padding: 6px 16px;
        border-radius: 20px;
        border: 1px solid var(--rule);
        background: var(--cream-card);
        color: var(--ink-soft);
        font-size: 12px;
        cursor: pointer;
        transition: all 0.15s;
        font-family: "JetBrains Mono", monospace;
      }
      .dur-btn.selected { border-color: var(--sun); color: var(--ink); background: var(--sun-soft); }
      .dur-btn:hover:not(.selected) { border-color: var(--sun); color: var(--ink); }

      /* ------------ Voice screen ------------ */
      #voice-screen {
        background: var(--bg-dark);
        color: var(--text-dark);
        height: 100vh;
        display: none;
        grid-template-rows: 60px 1fr;
      }
      #voice-screen.active { display: grid; }

      .voice-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        border-bottom: 1px solid var(--rule);
        height: 60px;
        flex-shrink: 0;
        background: var(--cream-card);
      }
      .voice-wordmark {
        font-family: "Fraunces", ui-serif, Georgia, serif;
        font-variation-settings: "opsz" 144;
        font-size: 18px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.02em;
      }
      .voice-topbar-right { display: flex; align-items: center; gap: 16px; }
      .voice-timer {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        color: var(--ink-mute);
        letter-spacing: 0.05em;
        font-variant-numeric: tabular-nums;
      }
      .voice-end-btn {
        font-size: 13px;
        color: var(--ink-soft);
        border: 1px solid var(--rule);
        background: var(--cream-card);
        padding: 6px 14px;
        border-radius: 20px;
        cursor: pointer;
        transition: color 0.15s, border-color 0.15s, background 0.15s;
      }
      .voice-end-btn:hover { color: var(--coral); border-color: var(--coral); background: #FFEEEA; }

      .voice-content {
        display: grid;
        grid-template-columns: 1fr 320px;
        overflow: hidden;
      }
      @media (max-width: 768px) {
        .voice-content { grid-template-columns: 1fr; grid-template-rows: 140px 1fr; }
        .voice-orb-col { padding: 12px !important; }
        .voice-orb-col .orb { width: 100px !important; height: 100px !important; }
      }

      .voice-chat-col {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-right: 1px solid var(--rule);
      }
      @media (max-width: 768px) {
        .voice-chat-col { border-right: none; border-top: 1px solid var(--rule); order: 2; }
        .voice-orb-col { order: 1; }
      }

      #timeline {
        flex: 1;
        overflow-y: auto;
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        scrollbar-width: thin;
        scrollbar-color: var(--rule) transparent;
      }
      #timeline::-webkit-scrollbar { width: 6px; }
      #timeline::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

      #chat-empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: var(--ink-mute);
        font-size: 13px;
        pointer-events: none;
      }
      #chat-empty-state .dot {
        width: 32px; height: 32px; border-radius: 50%;
        background: var(--paper-2); display: flex; align-items: center; justify-content: center;
        font-size: 16px; color: var(--ink-mute);
      }

      .orb.barge-in { animation: bargeInFlash 0.3s ease-out !important; }
      @keyframes bargeInFlash {
        0%   { transform: scale(1.15); opacity: 0.6; }
        100% { transform: scale(1);    opacity: 1;   }
      }

      @keyframes dotPulse {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
        40%           { opacity: 1;   transform: scale(1);   }
      }

      .voice-orb-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px;
        background: var(--paper-2);
      }
      .orb-state-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--ink-soft);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .orb {
        width: 200px; height: 200px;
        border-radius: 50%;
        position: relative;
        background: radial-gradient(circle at 30% 30%, #FCE0A9 0%, #F4ECDC 70%);
        box-shadow: inset 0 0 60px rgba(244,178,74,0.15), 0 0 60px rgba(244,178,74,0.12);
        animation: orbIdle 4s ease-in-out infinite;
      }
      @media (max-width: 768px) {
        .orb { width: 120px; height: 120px; }
      }
      @keyframes orbIdle {
        0%, 100% { box-shadow: inset 0 0 60px rgba(244,178,74,0.15), 0 0 60px rgba(244,178,74,0.12); }
        50%      { box-shadow: inset 0 0 80px rgba(244,178,74,0.25), 0 0 90px rgba(244,178,74,0.18); }
      }
      .orb.listening {
        background: radial-gradient(circle at 30% 30%, #F4B24A 0%, #C8852A 70%);
        animation: orbListening 1.2s ease-in-out infinite;
      }
      @keyframes orbListening {
        0%, 100% { transform: scale(1);    box-shadow: 0 0 60px rgba(244,178,74,0.45); }
        50%      { transform: scale(1.08); box-shadow: 0 0 100px rgba(244,178,74,0.75); }
      }
      .orb.thinking {
        background: radial-gradient(circle at 30% 30%, #EFE4CE 0%, #D9CBA9 70%);
      }
      .orb.thinking::before {
        content: "";
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 2px dashed var(--coral);
        animation: spin 3s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .orb.speaking {
        background: radial-gradient(circle at 30% 30%, #F4B24A 0%, #3F8C85 80%);
      }
      .orb.speaking::after, .orb.speaking::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--sun);
        animation: ripple 1.4s ease-out infinite;
      }
      .orb.speaking::before { animation-delay: 0.7s; }
      @keyframes ripple {
        from { transform: scale(1); opacity: 0.8; }
        to   { transform: scale(1.6); opacity: 0; }
      }

      .live-transcript {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: #6b7280;
        max-width: 320px;
        text-align: center;
        min-height: 32px;
        line-height: 1.5;
      }

      .error { color: #f87171; font-size: 13px; min-height: 18px; padding: 0 24px; }

      /* ------------ Summary screen ------------ */
      #summary-screen { background: var(--bg-light); padding: 48px 24px 96px; }
      .summary-inner { max-width: 1080px; margin: 0 auto; }
      .summary-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 32px;
        gap: 24px;
        flex-wrap: wrap;
      }
      .summary-header h1 {
        font-family: "Fraunces", ui-serif, Georgia, serif;
        font-variation-settings: "opsz" 144;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.025em;
        margin: 0 0 12px;
        color: var(--ink);
      }
      .summary-section h2 {
        font-family: "Fraunces", ui-serif, Georgia, serif;
        font-variation-settings: "opsz" 144;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .stat-card { background: var(--cream-card); border-color: var(--rule); box-shadow: 0 1px 0 rgba(30,26,20,0.04), 0 18px 40px -28px rgba(30,26,20,0.12); }
      .summary-section .card { background: var(--cream-card); border-color: var(--rule); box-shadow: 0 1px 0 rgba(30,26,20,0.04), 0 18px 40px -28px rgba(30,26,20,0.12); }
      .topic-pill { background: var(--cream-card); border-color: var(--rule); }
      .badge { background: var(--cream-card); border-color: var(--rule); }
      .stat-value { font-family: "Fraunces", ui-serif, Georgia, serif; font-variation-settings: "opsz" 144; }
      .summary-meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--muted-light); }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.01em;
        background: white;
        border: 1px solid var(--border-light);
        color: var(--text-light);
        font-family: "JetBrains Mono", monospace;
      }
      .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

      .stat-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 48px;
      }
      .stat-card {
        background: white;
        border: 1px solid var(--border-light);
        border-radius: 16px;
        padding: 24px;
      }
      .stat-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-light); margin-bottom: 8px; }
      .stat-value { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }

      .summary-section { margin-bottom: 48px; }
      .summary-section h2 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 20px;
      }
      .summary-section .card {
        background: white;
        border: 1px solid var(--border-light);
        border-radius: 16px;
        padding: 24px;
      }

      .events-table { width: 100%; border-collapse: collapse; font-size: 14px; }
      .events-table th, .events-table td {
        text-align: left;
        padding: 12px 8px;
        border-bottom: 1px solid var(--border-light);
        vertical-align: top;
      }
      .events-table th { font-weight: 500; font-size: 12px; color: var(--muted-light); text-transform: uppercase; letter-spacing: 0.06em; }
      .events-table tr:last-child td { border-bottom: none; }
      .events-table td.transcript { color: var(--muted-light); max-width: 380px; }

      .donut-row { display: grid; grid-template-columns: 240px 1fr; gap: 32px; align-items: center; }
      @media (max-width: 640px) { .donut-row { grid-template-columns: 1fr; } }
      .donut-wrap { display: flex; flex-direction: column; align-items: center; }
      .donut svg { display: block; }
      .donut-center-label { text-align: center; margin-top: -130px; pointer-events: none; }
      .donut-center-label .num { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; display: block; }
      .donut-center-label .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-light); }
      .legend { display: flex; flex-direction: column; gap: 8px; }
      .legend-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
      .legend-row .swatch { width: 10px; height: 10px; border-radius: 2px; }
      .legend-row .name { font-family: "JetBrains Mono", monospace; }
      .legend-row .count { color: var(--muted-light); margin-left: auto; font-variant-numeric: tabular-nums; }

      .topics { display: flex; flex-wrap: wrap; gap: 8px; }
      .topic-pill {
        background: white;
        border: 1px solid var(--border-light);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 13px;
        color: var(--text-light);
      }
      .topic-pill .count { color: var(--muted-light); margin-left: 6px; font-size: 11px; }

      .escalate-banner {
        background: #fffbeb;
        border: 1px solid #fcd34d;
        border-radius: 12px;
        padding: 16px 20px;
        margin-bottom: 32px;
        color: #92400e;
      }
      .escalate-banner h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
      .escalate-banner ul { margin: 8px 0 0; padding-left: 20px; font-size: 14px; }

      /* Skeleton */
      .skeleton {
        background: linear-gradient(90deg, #f0efed 0%, #e5e4e2 50%, #f0efed 100%);
        background-size: 200% 100%;
        animation: shimmer 1.4s ease-in-out infinite;
        border-radius: 8px;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      /* ------------ PIN gate ------------ */
      #pin-screen {
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: var(--paper);
      }
      #pin-screen.active { display: flex; }

      #pin-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 48px 40px;
        background: var(--cream-card);
        border: 1px solid var(--rule);
        border-radius: 20px;
        width: 320px;
        box-shadow: 0 1px 0 rgba(30,26,20,0.04), 0 18px 40px -24px rgba(30,26,20,0.18);
      }
      #pin-logo {
        font-family: "Fraunces", ui-serif, Georgia, serif;
        font-variation-settings: "opsz" 144;
        font-size: 28px;
        color: var(--ink);
        letter-spacing: -0.02em;
      }
      #pin-label {
        font-size: 13px;
        color: var(--ink-mute);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin: 0;
      }
      #pin-dots { display: flex; gap: 16px; }
      .pin-dot {
        width: 14px; height: 14px;
        border-radius: 50%;
        border: 1.5px solid var(--rule);
        background: transparent;
        transition: background 0.15s, border-color 0.15s;
      }
      .pin-dot.filled { background: var(--ink); border-color: var(--ink); }
      .pin-dot.error  { background: var(--coral); border-color: var(--coral); animation: pinShake 0.4s ease; }
      @keyframes pinShake {
        0%, 100% { transform: translateX(0); }
        20%      { transform: translateX(-6px); }
        40%      { transform: translateX(6px); }
        60%      { transform: translateX(-4px); }
        80%      { transform: translateX(4px); }
      }
      #pin-error {
        font-size: 12px;
        color: var(--coral);
        opacity: 0;
        transition: opacity 0.2s;
        height: 16px;
        margin: -16px 0;
      }
      #pin-error.visible { opacity: 1; }
      #pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; }
      .pin-key {
        width: 72px; height: 72px;
        border-radius: 50%;
        border: 1px solid var(--rule);
        background: var(--paper);
        color: var(--ink);
        font-size: 22px;
        font-family: "Inter", sans-serif;
        cursor: pointer;
        transition: background 0.1s, transform 0.1s;
        display: flex; align-items: center; justify-content: center;
      }
      .pin-key:hover:not(:disabled) { background: var(--cream-card); }
      .pin-key:active:not(:disabled) { transform: scale(0.93); background: var(--rule); }
      .pin-key-empty { border: none; background: transparent; cursor: default; }
      .pin-key-del { font-size: 18px; color: var(--ink-mute); }
      .pin-key:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

      /* Screen transitions */
      .screen, #age-gate { transition: opacity 0.2s ease; }
      .fade-out { opacity: 0 !important; pointer-events: none; }

      /* ------------ Mobile polish ------------ */
      @media (max-width: 640px) {
        .nav { padding: 12px 16px; }
        .hero { padding: 56px 20px; }
        .hero h1 { font-size: 28px; letter-spacing: -0.02em; }
        .hero p { font-size: 16px; }
        .hero-orb-bg { width: 280px; height: 280px; opacity: 0.4; }
        .hero-ctas { flex-direction: column; gap: 12px; }
        .how { padding: 64px 20px; }
        .cols-3 { grid-template-columns: 1fr; }
        .arch { padding: 56px 16px; }
        .arch-diagram { font-size: 11px; overflow-x: auto; text-align: left; }
        .summary-header h1 { font-size: 24px; }
        #summary-screen { padding: 24px 16px 64px; }
        .donut-row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <!-- ==================== Fatal error overlay ==================== -->
    <div id="fatal-error" style="display:none; position:fixed; inset:0; background:rgba(251,246,236,0.97); backdrop-filter:blur(8px); z-index:200; align-items:center; justify-content:center; padding:24px;">
      <div style="background:#FFFBF2; border:1px solid #E3D7BE; border-radius:20px; padding:40px; max-width:480px; width:100%; text-align:center; box-shadow:0 1px 0 rgba(30,26,20,0.04), 0 30px 60px -30px rgba(30,26,20,0.22);">
        <div style="width:48px; height:48px; border-radius:50%; background:#FFEEEA; display:inline-flex; align-items:center; justify-content:center; margin-bottom:20px;">
          <span style="color:#C0533F; font-size:24px; line-height:1;">⚠</span>
        </div>
        <h2 id="fatal-title" style="font-family:'Fraunces',ui-serif,Georgia,serif; font-variation-settings:'opsz' 144; font-size:24px; font-weight:600; color:#1E1A14; margin:0 0 12px; letter-spacing:-0.015em;">Something went wrong</h2>
        <p id="fatal-message" style="color:#4A433A; font-size:15px; line-height:1.55; margin:0 0 12px;"></p>
        <p id="fatal-detail" style="color:#8A8170; font-size:12px; font-family:'JetBrains Mono',monospace; margin:0 0 28px; word-break:break-word;"></p>
        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
          <button id="fatal-retry" class="btn-primary" style="display:none;">Try again</button>
          <button id="fatal-home" class="btn-ghost">Back to start</button>
        </div>
      </div>
    </div>

    <!-- ==================== PIN gate ==================== -->
    <div id="pin-screen" class="screen active">
      <div id="pin-container">
        <div id="pin-logo">Lumo</div>
        <p id="pin-label">Enter access PIN</p>
        <div id="pin-dots">
          <div class="pin-dot" id="dot-0"></div>
          <div class="pin-dot" id="dot-1"></div>
          <div class="pin-dot" id="dot-2"></div>
          <div class="pin-dot" id="dot-3"></div>
        </div>
        <div id="pin-error">Incorrect PIN. Try again.</div>
        <div id="pin-pad">
          <button class="pin-key" data-digit="1">1</button>
          <button class="pin-key" data-digit="2">2</button>
          <button class="pin-key" data-digit="3">3</button>
          <button class="pin-key" data-digit="4">4</button>
          <button class="pin-key" data-digit="5">5</button>
          <button class="pin-key" data-digit="6">6</button>
          <button class="pin-key" data-digit="7">7</button>
          <button class="pin-key" data-digit="8">8</button>
          <button class="pin-key" data-digit="9">9</button>
          <button class="pin-key pin-key-empty" disabled></button>
          <button class="pin-key" data-digit="0">0</button>
          <button class="pin-key pin-key-del" id="pin-del" aria-label="Delete">⌫</button>
        </div>
      </div>
    </div>

    <!-- ==================== Age gate modal ==================== -->
    <div id="age-gate">
      <div class="modal">
        <button class="modal-close" id="age-close" aria-label="Close">×</button>
        <div class="modal-orb"></div>
        <h2>Hi! How old are you?</h2>
        <p class="modal-sub">I'll make sure we talk about the right things for you.</p>
        <div class="age-cards">
          <button class="age-card" data-age="4-6">4 – 6</button>
          <button class="age-card" data-age="7-9">7 – 9</button>
          <button class="age-card" data-age="10-12">10 – 12</button>
        </div>
        <div id="duration-select" style="margin-top:24px; text-align:center;">
          <p style="color:#555; font-size:12px; margin:0 0 10px; letter-spacing:0.05em; text-transform:uppercase;">Session length</p>
          <div style="display:flex; gap:8px; justify-content:center;">
            <button class="dur-btn" data-seconds="180">3 min</button>
            <button class="dur-btn selected" data-seconds="300">5 min</button>
            <button class="dur-btn" data-seconds="600">10 min</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== Voice screen ==================== -->
    <div id="voice-screen" class="screen">
      <div class="voice-topbar">
        <div class="voice-wordmark">Lumo</div>
        <div class="voice-topbar-right">
          <div class="voice-timer" id="timer">5:00</div>
          <button class="voice-end-btn" id="end-btn">End session</button>
        </div>
      </div>
      <div class="voice-content">
        <div class="voice-chat-col">
          <div id="safety-warning" style="display:none; background:#FFEEEA; border-bottom:1px solid #E86B5A; padding:12px 24px; flex-shrink:0;">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:16px;">
              <div style="display:flex; align-items:center; gap:12px; min-width:0;">
                <span style="color:#C0533F; font-size:18px; line-height:1;">⚠</span>
                <div style="min-width:0;">
                  <div id="safety-reason" style="color:#8B2F1E; font-size:13px; font-weight:600; letter-spacing:0.02em;">Content flagged</div>
                  <div style="color:#A85541; font-size:12px; margin-top:2px;">
                    Lumo blocked this response. Session summary loading in
                    <span id="safety-countdown">5</span>s…
                  </div>
                </div>
              </div>
              <div style="width:36px; height:36px; border-radius:50%; border:2px solid #E86B5A; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:#FFFBF2;">
                <span style="color:#C0533F; font-size:13px; font-weight:600;" id="safety-countdown-num">5</span>
              </div>
            </div>
          </div>
          <div id="timeline">
            <div id="chat-empty-state">
              <div class="dot">◎</div>
              <span>Start speaking to begin</span>
            </div>
          </div>
          <div class="error" id="error" style="padding:0 24px 8px"></div>
        </div>
        <div class="voice-orb-col">
          <div class="orb" id="orb"></div>
          <div class="orb-state-label" id="status">Tap to speak</div>
        </div>
      </div>
    </div>

    <!-- ==================== Summary screen ==================== -->
    <div id="summary-screen" class="screen">
      <div class="summary-inner" id="summary-inner">
        <!-- populated by summary.ts -->
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
